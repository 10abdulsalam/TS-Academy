<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Gallery</title>
</head>
<body>
  <h1>Multimedia Gallery</h1>

  <figure>
    <img src="images/photo1.svg" alt="A bright sunrise over a calm lake">
    <figcaption>Sunrise over a calm lake</figcaption>
  </figure>

  <figure>
    <img src="images/photo2.svg" alt="A green forest path with sunlight passing through trees">
    <figcaption>Forest path in the morning light</figcaption>
  </figure>

  <figure>
    <img src="images/photo3.svg" alt="An abstract mountain landscape at sunset">
    <figcaption>Mountain view at sunset</figcaption>
  </figure>

  <figure>
    <audio controls>
      <source src="audio/sample.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
    <figcaption>Local audio player with an MP3 file</figcaption>
  </figure>

  <figure>
    <video controls poster="images/poster.svg" width="480">
      <source src="video/sample.mp4" type="video/mp4">
      Your browser does not support the video element.
    </video>
    <figcaption>Local video player with a poster image</figcaption>
  </figure>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Shopping List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shopping-list">
    <header>
      <p class="eyebrow">Grocery planner</p>
      <h1>Dynamic Shopping List</h1>
      <p class="intro">Add everything you need for your next shop.</p>
    </header>

    <form id="shopping-form" class="shopping-form">
      <label for="item-input">Add an item</label>
      <div class="input-row">
        <input id="item-input" name="item" type="text" placeholder="e.g. Oats" autocomplete="off" required>
        <button type="submit">Add item</button>
      </div>
    </form>

    <section class="list-panel" aria-labelledby="list-heading">
      <div class="list-heading-row">
        <h2 id="list-heading">Your list</h2>
        <span id="item-count" class="item-count">0 items</span>
      </div>
      <p id="summary" class="summary" aria-live="polite">Your shopping list is empty.</p>
      <ul id="shopping-list" class="items" aria-live="polite"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

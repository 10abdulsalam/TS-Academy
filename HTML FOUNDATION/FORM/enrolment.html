<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Enrolment Form</title>
</head>
<body>
  <h1>Student Enrolment Form</h1>

  <form action="#" method="post">
    <fieldset>
      <legend>Personal Details</legend>

      <label for="fullName">Full Name:</label><br>
      <input type="text" id="fullName" name="fullName" required><br><br>

      <label for="email">Email Address:</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="phone">Phone Number:</label><br>
      <input type="tel" id="phone" name="phone"><br><br>

      <label for="dob">Date of Birth:</label><br>
      <input type="date" id="dob" name="dob"><br><br>

      <label>Gender:</label><br>
      <input type="radio" id="male" name="gender" value="Male">
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="Female">
      <label for="female">Female</label>
      <input type="radio" id="other" name="gender" value="Other">
      <label for="other">Other</label><br><br>
    </fieldset>

    <fieldset>
      <legend>Account Details</legend>

      <label for="course">Preferred Course:</label><br>
      <select id="course" name="course">
        <optgroup label="Technology">
          <option value="Web Development">Web Development</option>
          <option value="Data Science">Data Science</option>
        </optgroup>
        <optgroup label="Business">
          <option value="Business Administration">Business Administration</option>
          <option value="Marketing">Marketing</option>
        </optgroup>
      </select><br><br>

      <label for="notes">Message / Notes:</label><br>
      <textarea id="notes" name="notes" rows="5"></textarea><br><br>

      <label for="photo">Profile Photo Upload:</label><br>
      <input type="file" id="photo" name="photo"><br><br>

      <input type="checkbox" id="terms" name="terms" required>
      <label for="terms">Agree to terms</label><br><br>
    </fieldset>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </form>
</body>
</html>

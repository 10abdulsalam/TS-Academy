name: Deploy planet explorer to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "HTML FOUNDATION/MILESTONE PROJECT/**"
      - ".github/workflows/deploy-planet-explorer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload planet explorer
        uses: actions/upload-pages-artifact@v3
        with:
          path: "HTML FOUNDATION/MILESTONE PROJECT"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
